# XcodeGen spec for the Maximize iOS app shell (MAX-006).
#
# The generated .xcodeproj is NOT checked in (see .gitignore) — a hand-maintained
# .xcodeproj is an unreviewable blob, and this repo's verification story depends on
# changes being readable in a diff. Regenerate locally with:
#
#   xcodegen generate
#
# CI regenerates it fresh on every run (.github/workflows/ci.yml) so this file is the
# only source of truth for the project's shape.

name: Maximize

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"

# Signing lives in an xcconfig rather than here, because it is the one part of this
# spec that differs per machine. Support/Signing.xcconfig defaults to fully unsigned
# (what CI needs) and optionally includes Support/Signing.local.xcconfig, which is
# gitignored and holds a developer's own team ID and bundle identifier.
#
# Build settings written here would *outrank* the xcconfig and make a local device
# build impossible without editing a committed file — which is exactly the situation
# that ends with someone's team ID in a diff. See docs/DEVICE-BUILD.md.

packages:
  MaximizeCore:
    path: .

targets:
  Maximize:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    dependencies:
      - package: MaximizeCore
      # Swift auto-links system frameworks it imports, so this is not strictly
      # required to build. It is here so the app's platform dependencies are legible
      # in the spec rather than only in an import statement.
      - sdk: HealthKit.framework
      # MAX-044 / FR-1.4: the route map view.
      - sdk: MapKit.framework

    # MAX-030 / FR-0.1. XcodeGen writes this file on `xcodegen generate` and points
    # CODE_SIGN_ENTITLEMENTS at it; like the .xcodeproj, the generated file is
    # gitignored so this spec stays the single reviewable source of truth.
    #
    # The keys below are the whole of tracker risk R5. PRD §13 recorded only moderate
    # confidence in the background-delivery key, and a wrong key here fails silently —
    # the app is simply never woken. Both were checked against Apple's current
    # documentation before being written down:
    #
    #   com.apple.developer.healthkit
    #     "HealthKit Entitlement" — "A Boolean value that indicates whether the app may
    #     request user authorization to access health and activity data that appears in
    #     the Health app." Added by enabling the HealthKit capability in Xcode.
    #     https://developer.apple.com/documentation/BundleResources/Entitlements/com.apple.developer.healthkit
    #
    #   com.apple.developer.healthkit.background-delivery
    #     "A Boolean value that indicates whether observer queries receive updates while
    #     running in the background." iOS 15.0+. Added by enabling the nested
    #     "Background Delivery" capability under HealthKit.
    #     https://developer.apple.com/documentation/BundleResources/Entitlements/com.apple.developer.healthkit.background-delivery
    #
    # The PRD's guess was right. Recorded here rather than only in the PR, because the
    # next person to touch this file is the one who needs the citation.
    #
    # NOT included: com.apple.developer.healthkit.access. That entitlement gates
    # clinical health records (FHIR documents from healthcare providers), which this
    # app does not read. Apple warns that App Review may reject apps enabling it
    # without using the data.
    #
    # MAX-021 / D6. Turns on CloudKit mirroring for the SwiftData workout store so
    # history survives a reinstall and reaches a second device signed into the same
    # iCloud account. Two keys, matching what Xcode itself writes when you enable the
    # iCloud → CloudKit capability in the UI:
    #
    #   com.apple.developer.icloud-container-identifiers
    #     The CloudKit container(s) this app may use. `iCloud.$(CFBundleIdentifier)`
    #     is Xcode's own default pattern, used here instead of a literal container ID
    #     so the value tracks PRODUCT_BUNDLE_IDENTIFIER automatically — CI and a
    #     fresh clone get `iCloud.com.example.maximize.app` from the placeholder in
    #     Support/Signing.xcconfig, and a signed device build gets the developer's own
    #     container from Support/Signing.local.xcconfig, with no edit needed here and
    #     no account identifier ever committed.
    #
    #   com.apple.developer.icloud-services
    #     Which iCloud service the container is used for. `CloudKit` only — this app
    #     does not use iCloud Documents/Drive.
    #
    # NOT included: `aps-environment` / `UIBackgroundModes: [remote-notification]`.
    # Those enable silent push so CloudKit sync can happen while the app is
    # suspended; without them, sync still runs, just only around foreground
    # launches/activations. Deliberately left out of this ticket's scope — D6's
    # requirement is "survives reinstall / reaches a second device," not
    # real-time delivery, and background push is its own entitlement surface to get
    # right. A future ticket can add it if sync latency turns out to matter.
    #
    # This does not create or provision a CloudKit container by itself — that step
    # happens once, per Apple ID, the first time Xcode signs and runs a build with
    # this capability (or via the CloudKit Dashboard). CI's unsigned build compiles
    # and links against this entitlement without needing one to exist; see MAX-021's
    # PR for the device-side setup this still needs.
    #
    # Written to Support/ rather than App/ deliberately: App/ is this target's sources
    # path, and a generated file dropped among hand-written sources is one XcodeGen
    # file-type heuristic away from being copied into the bundle as a resource.
    entitlements:
      path: Support/Maximize.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # The two iCloud entitlements were here and are deferred — see A8 in
        # docs/PRD-AMENDMENTS.md. Free Apple Developer provisioning does not grant
        # them, and this app is currently signed with a personal team, so requesting
        # them made the device build unsignable. Restoring them is this block plus
        # flipping `makeOnDisk`'s `cloudKitDatabase` default back to `.automatic`;
        # MAX-020's schema is still built to CloudKit's restrictions so that stays a
        # two-line change rather than a migration.

    # Signing and bundle identifier come from here, not from `settings` below, so a
    # local device build can override them without touching a committed file.
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig

    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for now; PRD doesn't call out iPad
        # No physical Info.plist checked in — Xcode's modern build-setting-driven
        # generation (the same default a fresh SwiftUI App template uses) covers the
        # two keys an App-lifecycle target needs. Nothing here is a styling choice.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

        # Required, not optional: "You must set the usage keys, or your app will crash
        # when you request authorization."
        # https://developer.apple.com/documentation/healthkit/hkhealthstore/requestauthorization(toshare:read:completion:)
        #
        # The string is what the user reads on the permission sheet, so it names what
        # is actually read and says plainly that nothing is written.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Maximize reads your completed workouts — heart rate, distance, energy, steps and route — so it can score each run against your training plan automatically."

        # NSHealthUpdateUsageDescription is deliberately absent. It is required only
        # for apps that write to HealthKit, and PRD §3 lists writing as an explicit
        # non-goal. Declaring it would put a write-permission row on the sheet for a
        # capability this app does not have.
