name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test MaximizeCore
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  architecture:
    name: Core stays platform-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MaximizeCore must not depend on UI, persistence, or platform frameworks; that
      # is what keeps the scoring and metrics logic testable in CI without a
      # simulator or a device. See CLAUDE.md.
      - name: Reject platform imports in MaximizeCore
        run: |
          BANNED='SwiftUI|UIKit|HealthKit|SwiftData|CloudKit|MapKit|Charts'
          if grep -rEn "^\s*import\s+($BANNED)\b" Sources/MaximizeCore; then
            echo "::error::MaximizeCore must not import platform frameworks ($BANNED)."
            echo "Define a protocol or value type in the core; implement it in the app layer."
            exit 1
          fi
          echo "OK: no platform framework imports in MaximizeCore."
