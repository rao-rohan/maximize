name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test MaximizeCore
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  architecture:
    name: Core stays platform-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MaximizeCore must not depend on UI, persistence, or platform frameworks; that
      # is what keeps the scoring and metrics logic testable in CI without a
      # simulator or a device. See CLAUDE.md.
      - name: Reject platform imports in MaximizeCore
        run: |
          # Security is on this list because of MAX-022: the core defines the
          # AnthropicAPIKeyStoring protocol, and the Keychain implementation lives in
          # the app layer. Without the guard, nothing stops a later ticket from
          # reaching for SecItemCopyMatching directly in the core and quietly making
          # the key-handling path untestable again.
          BANNED='SwiftUI|UIKit|HealthKit|SwiftData|CloudKit|MapKit|Charts|Security'
          if grep -rEn "^\s*import\s+($BANNED)\b" Sources/MaximizeCore; then
            echo "::error::MaximizeCore must not import platform frameworks ($BANNED)."
            echo "Define a protocol or value type in the core; implement it in the app layer."
            exit 1
          fi
          echo "OK: no platform framework imports in MaximizeCore."

      # MAX-040's design system is only worth having if views name meaning
      # (Color.textSecondary) rather than appearance. One stray literal is harmless;
      # the habit is what erodes a palette, and it erodes quietly — nothing breaks,
      # the colors just stop agreeing with each other.
      #
      # MAX-070 moved the palette values into MaximizeCore as DesignPalette so their
      # WCAG contrast could be computed and tested without UIKit, leaving App/
      # entirely literal-free. So this guard now admits no exceptions: a color value
      # anywhere under App/ is a value escaping the contrast suite that guards it.
      - name: Reject raw color literals in the app layer
        run: |
          HITS=$(grep -rEn '0x[0-9A-Fa-f]{6}|Color\(red:|UIColor\(red:|Color\(\.sRGB' \
            --include='*.swift' App || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Raw color values belong in Sources/MaximizeCore/Accessibility/DesignPalette.swift."
            echo "Define it there so WCAGContrastTests covers it, then expose a semantic token in ColorTokens.swift."
            exit 1
          fi
          echo "OK: no raw color literals anywhere in App/."

  ios-app:
    name: Build app shell for iOS Simulator
    # macos-26 (Tahoe) has been GA on GitHub-hosted runners since Feb 2026 and is the
    # natural home for iOS 26 SDK work — PRD §7.4 wants Liquid Glass, which needs
    # Xcode 26. Independent of this runner's default Xcode, the next step verifies a
    # 26.x toolchain is actually present and fails loudly if it isn't, rather than
    # silently building against an older SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK, required for PRD §7.4 Liquid Glass)
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_26" ]; then
            echo "::error::No Xcode 26.x found on this runner. PRD §7.4 requires the iOS 26 SDK for Liquid Glass; refusing to silently fall back to an older SDK."
            echo "Available Xcode installs:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Selecting $XCODE_26"
          sudo xcode-select -s "$XCODE_26/Contents/Developer"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      # Unsigned build against a generic simulator destination — no specific
      # device/OS pinned, so this doesn't depend on which simulator runtimes happen
      # to be pre-provisioned on the runner. This proves the app target compiles and
      # links MaximizeCore; it does not run the app or verify anything visually.
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project Maximize.xcodeproj \
            -scheme Maximize \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Package the built .app so a human can actually run it. Everything else in this
      # pipeline verifies that code compiles and its logic behaves; nothing until now
      # produced something anyone could look at.
      #
      # Deliberately a *simulator* build: it needs no Apple account, no certificate and
      # no secret, so it works on every commit for anyone. The limitation is real and
      # specific — HealthKit background delivery does not function in the Simulator
      # (Apple's own documentation says so, confirmed at MAX-030), and there is no real
      # Health data there. So this artifact is for reviewing the interface, not for
      # testing capture. A device build is the only way to exercise the actual product.
      - name: Package the simulator app
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app produced — the build step's output layout changed."
            find build/DerivedData/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Packaging $APP"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifact/Maximize-Simulator.zip
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Maximize-Simulator-${{ github.sha }}
          path: artifact/Maximize-Simulator.zip
          retention-days: 30
          if-no-files-found: error

      - name: Explain how to run it
        run: |
          {
            echo "### Simulator build ready"
            echo
            echo "Download **Maximize-Simulator-\`${GITHUB_SHA:0:7}\`** from this run's Artifacts, then:"
            echo
            echo '```sh'
            echo "unzip Maximize-Simulator.zip"
            echo "xcrun simctl boot 'iPhone 17 Pro'   # or any installed iOS 26 simulator"
            echo "open -a Simulator"
            echo "xcrun simctl install booted Maximize.app"
            echo "xcrun simctl launch booted com.example.maximize.app"
            echo '```'
            echo
            echo "**This runs in the Simulator only.** HealthKit background delivery does not"
            echo "work there and there is no real Health data, so it shows the interface, not"
            echo "the capture pipeline. Testing zero-touch capture needs a signed device build."
          } >> "$GITHUB_STEP_SUMMARY"
